<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seguimiento de Paquetes</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.header {
  background: #2563eb;
  color: white;
  text-align: center;
  padding: 30px 20px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.container {
  max-width: 700px;
  margin: 35px auto;
  padding: 0 20px;
}

.intro {
  text-align: center;
  margin-bottom: 25px;
  font-size: 18px;
}

.tracking-box {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.tracking-box h2 {
  text-align: center;
  margin-top: 0;
}

input {
  width: 100%;
  padding: 18px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 18px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 18px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.details {
  background: white;
  margin-top: 30px;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.details h2 {
  margin-top: 0;
}

.detail {
  margin: 12px 0;
  font-size: 16px;
}

.detail strong {
  color: #222;
}

.status {
  color: #2563eb;
  font-weight: bold;
}

.timeline {
  margin-top: 30px;
}

.timeline-item {
  position: relative;
  padding: 0 0 25px 35px;
  border-left: 3px solid #d1d5db;
}

.timeline-item:last-child {
  border-left: none;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -9px;
  top: 0;
  width: 15px;
  height: 15px;
  background: #d1d5db;
  border-radius: 50%;
}

.timeline-item.completed::before {
  background: #22c55e;
}

.timeline-item.current::before {
  background: #2563eb;
  box-shadow: 0 0 0 5px #dbeafe;
}

.timeline-item h3 {
  margin: 0 0 5px;
  font-size: 17px;
}

.timeline-item p {
  margin: 0;
  color: #666;
}

.timeline-item.completed h3 {
  color: #16a34a;
}

.timeline-item.current h3 {
  color: #2563eb;
}

.timeline-item.pending h3 {
  color: #777;
}

.error {
  color: #dc2626;
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
}

.footer {
  text-align: center;
  color: #777;
  padding: 30px;
}

@media (max-width: 600px) {
  .header h1 {
    font-size: 28px;
  }

  .tracking-box,
  .details {
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📦 Seguimiento de Paquetes</h1>
</div>

<div class="container">

  <div class="intro">
    Rastrea tu paquete de forma rápida y sencilla.
  </div>

  <div class="tracking-box">

    <h2>Rastrea tu paquete</h2>

    <input
      type="text"
      id="trackingNumber"
      placeholder="Introduce el número de seguimiento"
    >

    <button onclick="trackPackage()">
      Rastrear paquete
    </button>

  </div>

  <div id="result"></div>

</div>

<div class="footer">
  © 2026 Seguimiento de Paquetes
</div>

<script>

const packages = {

  "PKG36295": {
    status: "En Tránsito",
    location: "London Processing Center",
    destination: "Katia Elibet Montalvo Laureano, Calle San Jose número 28 segunda planta, Ibiza, Islas Baleares, España, Santa Eulalia del Río",
    shipmentDate: "29 de septiembre de 2026",
    deliveryDate: "1 de octubre de 2026"
  },

  "PKG67890": {
    status: "En Reparto",
    location: "Centro de Distribución Local",
    destination: "Dirección del cliente",
    shipmentDate: "29 de septiembre de 2026",
    deliveryDate: "1 de octubre de 2026"
  },

  "PKG55555": {
    status: "Entregado",
    location: "Dirección del cliente",
    destination: "Dirección del cliente",
    shipmentDate: "29 de septiembre de 2026",
    deliveryDate: "1 de octubre de 2026"
  }

};


function trackPackage() {

  const trackingNumber =
    document.getElementById("trackingNumber")
    .value
    .trim()
    .toUpperCase();

  const result = document.getElementById("result");

  if (!trackingNumber) {

    result.innerHTML =
      '<div class="error">Introduce un número de seguimiento.</div>';

    return;
  }

  const packageInfo = packages[trackingNumber];

  if (!packageInfo) {

    result.innerHTML =
      '<div class="error">No se encontró ningún paquete con ese número.</div>';

    return;
  }

  const stages = [
    "Paquete recibido",
    "Salió de la instalación de origen",
    "En Tránsito",
    "Llegó a la instalación de destino",
    "En Reparto",
    "Entregado"
  ];

  const descriptions = [
    "El paquete ha sido recibido por el transportista.",
    "El paquete ha salido de la instalación de origen.",
    "El paquete se encuentra actualmente en tránsito hacia su destino.",
    "El paquete ha llegado a la instalación de destino.",
    "El paquete está siendo preparado para su entrega.",
    "El paquete ha sido entregado."
  ];

  const currentStage = stages.indexOf(packageInfo.status);

  let timelineHTML = "";

  stages.forEach((stage, index) => {

    let className = "timeline-item";

    if (index < currentStage) {
      className += " completed";
    } else if (index === currentStage) {
      className += " current";
    } else {
      className += " pending";
    }

    timelineHTML += `
      <div class="${className}">
        <h3>${stage}</h3>
        <p>${descriptions[index]}</p>
      </div>
    `;
  });


  result.innerHTML = `

    <div class="details">

      <h2>Detalles del Envío</h2>

      <div class="detail">
        📦 <strong>Número de Seguimiento:</strong>
        ${trackingNumber}
      </div>

      <div class="detail">
        📍 <strong>Ubicación Actual:</strong>
        ${packageInfo.location}
      </div>

      <div class="detail">
        🚩 <strong>Estado:</strong>
        <span class="status">${packageInfo.status}</span>
      </div>

      <div class="detail">
        🏁 <strong>Destino:</strong>
        ${packageInfo.destination}
      </div>

      <div class="detail">
        📅 <strong>Fecha de Envío:</strong>
        ${packageInfo.shipmentDate}
      </div>

      <div class="detail">
        🚚 <strong>Entrega Estimada:</strong>
        ${packageInfo.deliveryDate}
      </div>

      <div class="timeline">

        <h2>Historial del Envío</h2>

        ${timelineHTML}

      </div>

    </div>

  `;
}

</script>

</body>
</html>
