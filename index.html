<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shipment Tracking</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.header {
  background: #2563eb;
  color: white;
  text-align: center;
  padding: 30px 20px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.container {
  max-width: 700px;
  margin: 35px auto;
  padding: 0 20px;
}

.intro {
  text-align: center;
  margin-bottom: 25px;
  font-size: 18px;
}

.tracking-box {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.tracking-box h2 {
  text-align: center;
  margin-top: 0;
}

input {
  width: 100%;
  padding: 18px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 18px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 18px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.details {
  background: white;
  margin-top: 30px;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.details h2 {
  margin-top: 0;
}

.detail {
    margin: 12px 0;
    font-size: 16px;
    color: #222;
}
.detail strong {
  color: #222;
}

.status {
  color: #2563eb;
  font-weight: bold;
}

.timeline {
  margin-top: 30px;
}

.timeline-item {
  position: relative;
  padding: 0 0 25px 35px;
  border-left: 3px solid #d1d5db;
}

.timeline-item:last-child {
  border-left: none;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -9px;
  top: 0;
  width: 15px;
  height: 15px;
  background: #d1d5db;
  border-radius: 50%;
}

.timeline-item.completed::before {
  background: #22c55e;
}

.timeline-item.current::before {
  background: #2563eb;
  box-shadow: 0 0 0 5px #dbeafe;
}

.timeline-item h3 {
  margin: 0 0 5px;
  font-size: 17px;
}

.timeline-item p {
  margin: 0;
  color: #666;
}

.timeline-item.completed h3 {
  color: #16a34a;
}

.timeline-item.current h3 {
  color: #2563eb;
}

.timeline-item.pending h3 {
  color: #777;
}

.error {
  color: #dc2626;
  text-align: center;
  font-weight: bold;
  margin-top: 20px;
}

.footer {
  text-align: center;
  color: #777;
  padding: 30px;
}

@media (max-width: 600px) {
  .header h1 {
    font-size: 28px;
  }

  .tracking-box,
  .details {
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="header">
<img src="IMG-20261002-WA0006(1).jpg" alt="British Express" style="width:180px; height:auto; display:block; margin:0 auto 10px;"> 
  <h1>📦 Shipment Tracking</h1>

<div class="container">

  <div class="intro">
    Track your package quickly and easily.
  </div>

  <div class="tracking-box">

    <h2>Track your package</h2>

    <input
      type="text"
      id="trackingNumber"
      placeholder="Enter your tracking number"
    >

    <button onclick="trackPackage()">
      Track package
    </button>

  </div>

  <div id="result"></div>

</div>

<div class="footer">
  © 2026 Shipment Tracking
</div>

<script>

const packages = {

  "PKG36295": {
    status: "In Transit",
    location: "Local Distribution Center",
    destination: "Customer Address",
    shipmentDate: "29 September 2026",
    deliveryDate: "1 October 2026"
  },

  "PKG63541": {
    status: "Out for Delivery",
    location: "Manila City",
    destination: "2F, Regional Center, 362 Magsaysay Avenue, Baguio City, 2600 Benguet Landmark beside PNB ",
    shipmentDate: "26 September 2026",
    deliveryDate: "30 September 2026"
  },

  "PKG39254": {
    status: "Delivered",
    location: "Local Distribution Center",
destination: "Customer Address",
shipmentDate: "29 September 2026",
deliveryDate: "30 september 2026"
  }

};


function trackPackage() {

  const trackingNumber =
    document.getElementById("trackingNumber")
    .value
    .trim()
    .toUpperCase();

  const result = document.getElementById("result");

  if (!trackingNumber) {

    result.innerHTML =
      '<div class="error">Please enter a tracking number.</div>';

    return;
  }

  const packageInfo = packages[trackingNumber];

  if (!packageInfo) {

    result.innerHTML =
      '<div class="error">No package was found with that tracking number.</div>';

    return;
  }

  const stages = [
    "Package received",
    "Departed origin facility",
    "In Transit",
    "Arrived at destination facility",
    "Out for Delivery",
    "Delivered"
];

  const descriptions = [
    "The package has been received by the carrier.",
    "The package has departed from the origin facility.",
    "The package is currently in transit to its destination.",
    "The package has arrived at the destination facility.",
    "The package is being prepared for delivery.",
    "The package has been delivered."
];

  const currentStage = stages.indexOf(packageInfo.status);

  let timelineHTML = "";

  stages.forEach((stage, index) => {

    let className = "timeline-item";

    if (index < currentStage) {
      className += " completed";
    } else if (index === currentStage) {
      className += " current";
    } else {
      className += " pending";
    }

    timelineHTML += `
      <div class="${className}">
        <h3>${stage}</h3>
        <p>${descriptions[index]}</p>
      </div>
    `;
  });


  result.innerHTML = `
<div class="details">

    <h2>Shipment Details</h2>

    <div class="detail">
        📦 <strong>Tracking Number:</strong>
        ${trackingNumber}
    </div>

    <div class="detail">
        📍 <strong>Current Location:</strong>
        ${packageInfo.location}
    </div>

    <div class="detail">
        🚩 <strong>Status:</strong>
        <span class="status">${packageInfo.status}</span>
    </div>

    <div class="detail">
        🏁 <strong>Destination:</strong>
        ${packageInfo.destination}
    </div>

    <div class="detail">
        📅 <strong>Shipment Date:</strong>
        ${packageInfo.shipmentDate}
    </div>

    <div class="detail">
        🚚 <strong>Estimated Delivery:</strong>
        ${packageInfo.deliveryDate}
    </div>

    <div class="timeline">
        <h2>Tracking History</h2>
        ${timelineHTML}
    </div>

</div>
`;
}

</script>

</body>
</html>
